
spring.application.name=attendance

# =====================================
# SQL SERVER DATABASE
# =====================================

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AttendanceDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =====================================
# JPA / HIBERNATE
# =====================================

# Validate database schema without changing it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================
# JWT AUTHENTICATION
# =====================================

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# =====================================
# EMAIL / SMTP
# =====================================

# Local Mailpit SMTP server
spring.mail.host=localhost
spring.mail.port=1025

# Mailpit does not require authentication
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Prevent email operations from hanging
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender address
app.mail.from=no-reply@attendance.local

# =====================================
# FLYWAY DATABASE MIGRATIONS
# =====================================

# Flyway manages future database changes
spring.flyway.enabled=true

# SQL Server schema
spring.flyway.default-schema=dbo

# Do not automatically baseline other databases
spring.flyway.baseline-on-migrate=false

# Existing AttendanceDB was baselined at version 1
spring.flyway.baseline-version=1

# Versioned SQL migration scripts
spring.flyway.locations=classpath:db/migration
